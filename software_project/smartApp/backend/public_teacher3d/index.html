<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D AI Teacher</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1120;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }

    #hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      color: #e2e8f0; font-size: 12.5px; background: rgba(2,6,23,.5);
      padding: 5px 12px; border-radius: 999px; backdrop-filter: blur(6px);
    }

    #who {
      position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; gap: 6px;
      background: rgba(2,6,23,.5); padding: 4px; border-radius: 12px; backdrop-filter: blur(6px);
    }
    #who button {
      border: none; background: transparent; color: #cbd5e1; font-size: 13px;
      font-weight: 700; padding: 7px 14px; border-radius: 9px; cursor: pointer;
    }
    #who button.on { background: #2563eb; color: #fff; }
    #who[hidden] { display: none; }

    /* subject teacher name badge (sits under the gender toggle when both show) */
    #teacher {
      position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 10px;
      background: rgba(2,6,23,.55); padding: 7px 12px 7px 8px; border-radius: 12px; backdrop-filter: blur(6px);
      color: #f1f5f9; --accent: #2563eb;
    }
    #teacher[hidden] { display: none; }
    #teacher::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
    #teacherName { font-size: 13.5px; font-weight: 800; }
    #teacherSubject { font-size: 11.5px; color: #cbd5e1; }
    #who:not([hidden]) ~ #teacher { top: 58px; }

    #answerBox {
      position: fixed; top: 54px; right: 16px; width: min(38vw, 430px); max-height: 44vh;
      overflow: auto; color: #f1f5f9; background: rgba(2,6,23,.72); padding: 14px 16px;
      border-radius: 12px; z-index: 20; font-size: 15px; line-height: 1.55;
      white-space: pre-wrap; backdrop-filter: blur(6px);
    }
    #answerBox:empty { display: none; }

    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 8px;
      padding: 14px; background: linear-gradient(transparent, rgba(0,0,0,.55));
    }
    #question {
      flex: 1; padding: 13px 15px; border: none; border-radius: 11px; font-size: 15px;
      background: #1e293b; color: #f1f5f9; outline: none;
    }
    #askBtn {
      padding: 13px 22px; border: none; border-radius: 11px; font-size: 15px; font-weight: 700;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    #askBtn:disabled { opacity: .5; cursor: default; }

    /* embedded in the app: the host renders transcript + input */
    body.embedded #bar, body.embedded #answerBox { display: none; }
  </style>
</head>
<body>
  <div id="who">
    <button id="femaleBtn" class="on">Female</button>
    <button id="maleBtn">Male</button>
  </div>
  <div id="teacher" hidden><b id="teacherName"></b><span id="teacherSubject"></span></div>
  <div id="hint">Loading teacher…</div>
  <canvas id="c"></canvas>
  <div id="answerBox"></div>
  <div id="bar">
    <input id="question" placeholder="Ask the teacher…" autocomplete="off" />
    <button id="askBtn">Ask</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/three/build/three.module.js",
      "three/addons/": "/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js?v=78"></script>
</body>
</html>
